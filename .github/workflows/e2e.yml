name: Playwright E2E Tests

on:
  push:
    branches:
      - navdeep-singh
  pull_request:
    branches:
      - navdeep-singh

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright E2E Tests with Cucumber
        run: |
          npx cucumber-js "tests/e2e/features/**/*.feature" \
            --import "tests/e2e/steps/**/*.ts" \
            --import "tests/e2e/support/**/*.ts" \
            --format html:tests/reports/cucumber-html/report.html

      - name: Upload Cucumber HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-html-report
          path: tests/reports/cucumber-html/
